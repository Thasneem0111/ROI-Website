<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Industries - ROI Admin (Clean)</title>
  <link rel="icon" type="image/png" href="../images/logo.png" />
  <link rel="stylesheet" href="./dashboard.css" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .is-invalid { border-color: #dc3545 !important; box-shadow: 0 0 0 0.2rem rgba(220,53,69,.25) !important; }
    .modal-backdrop.show { z-index: 2050 !important; }
    .modal { z-index: 2100 !important; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <img src="../images/logo.png" alt="Company Logo" class="company-logo" />
          <h2>ROYAL ORBIT<br/>INNOVATIONS</h2>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li><a href="dashboard.html"><i class="fa fa-th-large"></i> Dashboard</a></li>
            <li><a href="email.html"><i class="fa fa-envelope"></i> Emails</a></li>
            <li><a href="blog.html"><i class="fa fa-blog"></i> Blogs</a></li>
            <li><a href="clients.html"><i class="fa fa-users"></i> Clients</a></li>
            <li><a href="services.html"><i class="fa fa-cogs"></i> Services</a></li>
            <li class="active"><i class="fa fa-industry"></i> Industries</li>
          </ul>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <ul>
          <li><a href="setting.html"><i class="fa fa-user-cog"></i> Setting</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-panel">
      <div class="top-bar">
        <h1>Industries Management</h1>
        <div class="top-bar-right">
          <div class="search-bar">
            <input type="text" id="industrySearch" placeholder="Search industries..." onkeyup="applyFilter()" />
            <button><i class="fa fa-search"></i></button>
          </div>
        </div>
      </div>

      <div class="content-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3>Industries List</h3>
          <div>
            <button type="button" class="btn btn-primary me-2" id="seedStaticBtn">
              <i class="fa fa-plus"></i> Seed Default Industries
            </button>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addIndustryModal">
              <i class="fa fa-plus"></i> Add New Industry
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th width="5%">Select</th>
                <th width="45%">Industry Name</th>
                <th width="30%">Created Date</th>
                <th width="20%" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="industriesTableBody"></tbody>
          </table>
          <div class="small text-muted">Total: <span id="totalIndustriesCount">0</span></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Modal -->
  <div class="modal fade" id="addIndustryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Add New Industry</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="industryForm">
        <div class="modal-body">
          <div class="mb-3"><label class="form-label" for="industryName">Name <span class="text-danger">*</span></label><input id="industryName" class="form-control" required /></div>
          <div class="mb-3"><label class="form-label" for="industryDesc">Description <span class="text-danger">*</span></label><textarea id="industryDesc" class="form-control" rows="3" required></textarea></div>
          <div class="mb-3">
            <label class="form-label" for="industryUploadImage">Image <span class="text-danger">*</span></label>
            <div class="input-group">
              <input id="industryUploadImage" type="file" class="form-control d-none" accept="image/*" required />
              <button type="button" id="industryUploadBtn" class="btn btn-outline-secondary"><i class="fa fa-upload"></i> Choose Image</button>
            </div>
            <img id="industryPreviewImg" class="img-thumbnail mt-2" style="max-width:200px;display:none" alt="Preview" />
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button id="addNewIndustryBtn" class="btn btn-primary" type="button">Add Industry</button></div>
      </form>
    </div></div>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editIndustryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit Industry</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="editIndustryId" />
        <div class="mb-3"><label class="form-label" for="editIndustryName">Name <span class="text-danger">*</span></label><input id="editIndustryName" class="form-control" /></div>
        <div class="mb-3"><label class="form-label" for="editIndustryDesc">Description <span class="text-danger">*</span></label><textarea id="editIndustryDesc" class="form-control" rows="3"></textarea></div>
        <div class="mb-3"><label class="form-label" for="editIndustryImage">Image</label>
          <div class="input-group"><input id="editIndustryImage" type="file" class="form-control d-none" accept="image/*" /><button type="button" id="editIndustryUploadBtn" class="btn btn-outline-secondary"><i class="fa fa-upload"></i> Choose New Image</button></div>
          <img id="editIndustryPreviewImg" class="img-thumbnail mt-2" style="max-width:200px;display:none" alt="Preview" />
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button id="saveIndustryUpdatesBtn" class="btn btn-primary" type="button">Save Changes</button></div>
    </div></div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Confirm Deletion</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body text-center"><i class="fa fa-exclamation-triangle fa-3x text-danger mb-3"></i><p>Are you sure you want to delete this industry?</p></div>
      <div class="modal-footer justify-content-center"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button id="confirmDelete" class="btn btn-danger" type="button">Delete</button></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let dynamicIndustries = [];
      const STATIC = ['Automotive','Business & Finance','Food & Beverage','Construction','Hospitality','E-Commerce','General Retail','Coffee Shops','Real Estate','Entertainment & Events','Beauty & Personal Care','Health & Fitness','Recruitment & Staffing','Professional Services'].map(n => ({ id:'static-'+n, name:n, createdAt:null, isStatic:true }));
      let pendingDeleteId = null;

      const tbody = document.getElementById('industriesTableBody');
      const countEl = document.getElementById('totalIndustriesCount');

      function fmt(ts){ if(!ts) return '—'; try{ return new Date(ts).toLocaleString(); }catch{ return '—'; } }
      function combine(){ const dynNames = new Set(dynamicIndustries.map(d => (d.name||'').toLowerCase())); return [...STATIC.filter(s => !dynNames.has((s.name||'').toLowerCase())), ...dynamicIndustries]; }
      function updateCount(){ const dynNames = new Set(dynamicIndustries.map(d => (d.name||'').toLowerCase())); countEl.textContent = String(STATIC.filter(s => !dynNames.has((s.name||'').toLowerCase())).length + dynamicIndustries.length); }
      function render(list){ tbody.innerHTML=''; list.forEach(it => { const isS=!!it.isStatic; const tr=document.createElement('tr'); tr.innerHTML=`<td><input type="checkbox" ${isS?'disabled':''} data-id="${it.id}"></td><td>${it.name||''}</td><td class="text-end text-muted">${fmt(it.createdAt)}</td><td class="text-end">${isS?'':`<i class=\"fa fa-pen-to-square me-3\" style=\"color:#0f766e;cursor:pointer\" data-action=\"edit\" data-id=\"${it.id}\" title=\"Edit\"></i><i class=\"fa fa-trash\" style=\"color:#d9534f;cursor:pointer\" data-action=\"delete\" data-id=\"${it.id}\" title=\"Delete\"></i>`}</td>`; tbody.appendChild(tr); }); }

      async function load(){
        try{ const res = await fetch('./get_industries'); if(!res.ok) throw new Error('HTTP '+res.status); const data = await res.json(); dynamicIndustries = data.map(d => ({ id:String(d.id), name:d.name, description:d.description, imageUrl:d.image, createdAt:d.createdAt })); updateCount(); applyFilter(); }
        catch(e){ console.error(e); }
      }

      window.applyFilter = function(){ const q=(document.getElementById('industrySearch')?.value||'').toLowerCase(); const base=combine(); render(q? base.filter(i => (i.name||'').toLowerCase().includes(q)) : base); }

      tbody.addEventListener('click', (e)=>{ const t=e.target; if(!(t instanceof HTMLElement)) return; const a=t.getAttribute('data-action'); const id=t.getAttribute('data-id'); if(!a||!id) return; const it=dynamicIndustries.find(x=>x.id===id); if(!it) return; if(a==='delete'){ pendingDeleteId=id; new bootstrap.Modal(document.getElementById('deleteModal')).show(); } if(a==='edit'){ document.getElementById('editIndustryId').value=it.id; document.getElementById('editIndustryName').value=it.name||''; document.getElementById('editIndustryDesc').value=it.description||''; const prev=document.getElementById('editIndustryPreviewImg'); if(prev){ if(it.imageUrl){ prev.src=it.imageUrl; prev.style.display='block'; } else { prev.style.display='none'; } } new bootstrap.Modal(document.getElementById('editIndustryModal')).show(); }});

  document.getElementById('confirmDelete').addEventListener('click', async()=>{ if(!pendingDeleteId) return; try{ const fd=new FormData(); fd.append('id', pendingDeleteId); const res=await fetch('./api_delete',{method:'POST',body:fd}); const j=await res.json(); if(j.success) await load(); else alert('Delete failed'); } finally { pendingDeleteId=null; bootstrap.Modal.getInstance(document.getElementById('deleteModal'))?.hide(); }});

      // Add image helpers
      const addBtn=document.getElementById('industryUploadBtn'); const addFile=document.getElementById('industryUploadImage'); const addPrev=document.getElementById('industryPreviewImg');
      addBtn.addEventListener('click',()=>addFile.click()); addFile.addEventListener('change',(e)=>{ const f=e.target.files?.[0]; if(f&&addPrev){ const r=new FileReader(); r.onload=ev=>{ addPrev.src=ev.target.result; addPrev.style.display='block'; }; r.readAsDataURL(f);} else if(addPrev){ addPrev.style.display='none'; }});

      // Edit image helpers
      const eBtn=document.getElementById('editIndustryUploadBtn'); const eFile=document.getElementById('editIndustryImage'); const ePrev=document.getElementById('editIndustryPreviewImg');
      eBtn.addEventListener('click',()=>eFile.click()); eFile.addEventListener('change',(e)=>{ const f=e.target.files?.[0]; if(f&&ePrev){ const r=new FileReader(); r.onload=ev=>{ ePrev.src=ev.target.result; ePrev.style.display='block'; }; r.readAsDataURL(f);} });

      function valid(){ let ok=true; const n=document.getElementById('industryName'); const d=document.getElementById('industryDesc'); const img=document.getElementById('industryUploadImage'); [n,d].forEach(el=>{ if(!el.value.trim()){ el.classList.add('is-invalid'); ok=false; } else el.classList.remove('is-invalid'); }); if(!img.files||img.files.length===0){ img.classList.add('is-invalid'); ok=false; } else img.classList.remove('is-invalid'); return ok; }

        document.getElementById('addNewIndustryBtn').addEventListener('click', async()=>{ if(!valid()){ document.querySelector('.is-invalid')?.scrollIntoView({behavior:'smooth',block:'center'}); return; } try{ const name=document.getElementById('industryName').value.trim(); const description=document.getElementById('industryDesc').value.trim(); const file=addFile.files?.[0]; const fd=new FormData(); fd.append('name',name); fd.append('description',description); if(file) fd.append('image',file); const res=await fetch('./api_upload',{method:'POST',body:fd}); const j=await res.json(); if(j.success){ await load(); bootstrap.Modal.getInstance(document.getElementById('addIndustryModal'))?.hide(); document.getElementById('industryForm').reset(); if(addPrev) addPrev.style.display='none'; } else { alert('Add failed'); } } catch(e){ alert('Failed to add'); }});

  document.getElementById('saveIndustryUpdatesBtn').addEventListener('click', async()=>{ const id=document.getElementById('editIndustryId').value; if(!id) return; const name=document.getElementById('editIndustryName').value.trim(); const description=document.getElementById('editIndustryDesc').value.trim(); const file=eFile.files?.[0]; const fd=new FormData(); fd.append('id',id); fd.append('name',name); fd.append('description',description); if(file) fd.append('image',file); const res=await fetch('./api_update',{method:'POST',body:fd}); const j=await res.json(); if(j.success){ await load(); bootstrap.Modal.getInstance(document.getElementById('editIndustryModal'))?.hide(); } else { alert('Update failed'); }});

  document.getElementById('seedStaticBtn').addEventListener('click', async(e)=>{ const btn=e.currentTarget; btn.disabled=true; try{ const dynNames=new Set(dynamicIndustries.map(d=>(d.name||'').toLowerCase())); const preset=[{name:'Automotive',description:'Drive more leads and sales.'},{name:'Business & Finance',description:'Grow your financial services.'},{name:'Food & Beverage',description:'Attract more diners.'},{name:'Construction',description:'Win more projects.'},{name:'Hospitality',description:'Fill more rooms and tables.'},{name:'E-Commerce',description:'Boost online store sales.'},{name:'General Retail',description:'Drive foot traffic and online sales.'},{name:'Coffee Shops',description:'Engaging local marketing.'},{name:'Real Estate',description:'Showcase properties.'},{name:'Entertainment & Events',description:'Promote events and sell tickets.'},{name:'Beauty & Personal Care',description:'Grow your beauty brand.'},{name:'Health & Fitness',description:'Inspire more signups.'},{name:'Recruitment & Staffing',description:'Attract top talent.'},{name:'Professional Services',description:'Build authority and trust.'}]; let added=0; for(const it of preset){ if(dynNames.has(it.name.toLowerCase())) continue; const fd=new FormData(); fd.append('name',it.name); fd.append('description',it.description); const res=await fetch('./api_upload',{method:'POST',body:fd}); const j=await res.json(); if(j.success) added++; } if(added===0) alert('All preset industries already exist.'); else { alert(`Seeded ${added} industries.`); await load(); } } catch(err){ alert('Failed to seed'); } finally { btn.disabled=false; }});

      // Initial load
      load();
    });
  </script>
</body>
</html>
