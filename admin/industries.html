<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal-backdrop.show { z-index: 2050 !important; }
        .modal { z-index: 2100 !important; }
        .action-btn { background:#2ca6a4; color:#fff; border:none; border-radius:20px; padding:8px 24px; font-size:1rem; min-width:170px; min-height:44px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:background .2s,color .2s; }
        .action-btn:hover { background:#00796b; color:#fff; }
        .add-icon-circle { color:#ffffff; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; transition:background .2s,color .2s; }
        .add-btn:hover .add-icon-circle { background:#00796b; color:#fff; }
        #industriesTableBody tr { border-bottom:1px solid #eee; height:56px; }
        .is-invalid { border-color:#dc3545!important; box-shadow:0 0 0 .2rem rgba(220,53,69,.25)!important; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ROI - Marketing & Technology Agency</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <!-- Logout Confirmation Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0" style="justify-content:center;">
            <h5 class="modal-title w-100 text-center" id="logoutModalLabel" style="font-weight:700;">Logout Confirmation</h5>
            <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center" style="font-size:1.15rem; color:#222; padding:24px 12px 12px 12px;">
            <i class="fa fa-sign-out-alt" style="font-size:2.2rem; color:#2ca6a4; margin-bottom:12px;"></i><br>
            Are you sure you want to logout?
          </div>
          <div class="modal-footer border-0" style="justify-content:center; gap:18px; padding-bottom:24px;">
            <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal" style="border-radius:8px;">Cancel</button>
            <button type="button" class="btn btn-primary px-4" id="confirmLogout" style="border-radius:8px; background:#218a8a; border:none;">Yes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0" style="justify-content:center;">
            <h5 class="modal-title w-100 text-center" id="deleteModalLabel" style="font-weight:700;">Delete Industry</h5>
            <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center" style="font-size:1.15rem; color:#222; padding:24px 12px 12px 12px;">
            <i class="fa fa-trash" style="font-size:2.2rem; color:#d9534f; margin-bottom:12px;"></i><br>
            Do you want to delete this industry?
          </div>
          <div class="modal-footer border-0" style="justify-content:center; gap:18px; padding-bottom:24px;">
            <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal" style="border-radius:8px;">No</button>
            <button type="button" class="btn btn-danger px-4" id="confirmDelete" style="border-radius:8px; background:#d9534f; border:none;">Yes</button>
          </div>
        </div>
      </div>
    </div>

    <div class="dashboard-container">
      <!-- Sidebar (same as clients) -->
      <aside class="sidebar">
        <div class="sidebar-content">
          <div class="sidebar-header">
            <img src="../images/logo.png" alt="Company Logo" class="company-logo">
            <h2>ROYAL ORBIT<br>INNOVATIONS</h2>
          </div>
          <nav class="sidebar-nav">
            <ul>
              <li><a href="/admin/dashboard" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-th-large"></i> Dashboard</a></li>
              <li><a href="/admin/email" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-envelope"></i> Emails</a></li>
              <li><a href="/admin/blog" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-blog"></i> Blogs</a></li>
              <li><a href="/admin/clients" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-users"></i> Clients</a></li>
              <li><a href="/admin/services" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-cogs"></i> Services</a></li>
              <li class="active"><a href="/admin/industries" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-industry"></i> Industries</a></li>
            </ul>
          </nav>
        </div>
        <div class="sidebar-bottom">
          <ul>
            <li><a href="/admin/setting" style="color:inherit;text-decoration:none;display:flex;align-items:center;"><i class="fa fa-user-cog"></i> Setting</a></li>
            <li id="logoutBtn" style="cursor:pointer;"><i class="fa fa-sign-out-alt"></i> Logout</li>
          </ul>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-panel" style="display:flex; flex-direction:column; height:100vh;">
        <!-- Top Bar (fixed) -->
        <div class="top-bar" style="position:sticky; top:0; z-index:2; background:#fff;">
          <h1>Industries</h1>
          <div class="top-bar-right">
            <div class="search-bar">
              <input type="text" id="topSearch" placeholder="Search">
              <button><i class="fa fa-search"></i></button>
            </div>
            <div class="admin-profile">
              <img src="../images/man.png" alt="Admin" class="profile-pic">
              <span>Mr. Kaleel</span>
            </div>
          </div>
        </div>

        <!-- Industries Panel -->
        <div class="clients-panel" style="background:#fff; border-radius:16px; margin-top:32px; width:100%; max-width:none; box-shadow:0 2px 12px rgba(44,166,164,0.06); padding:32px 0 0 0; flex:1;">
          <div style="display:flex; gap:32px; padding:0 32px 24px 32px;">
            <div style="display:flex; align-items:center; background:#f7f8fa; border-radius:8px; padding:6px 18px; font-size:1rem; font-weight:500;">
              Total Industries <span id="totalIndustriesCount" style="margin-left:16px; font-size:1rem; font-weight:normal;">0</span>
            </div>
            <div style="flex:1; display:flex; align-items:center; background:#f7f8fa; border-radius:8px; padding:6px 18px;">
              <input type="text" id="industrySearch" placeholder="Search" style="border:none; background:transparent; font-size:1rem; width:100%; outline:none;">
              <button style="background:none; border:none; color:#222; font-size:1.3rem; cursor:pointer;" id="searchBtn"><i class="fa fa-search"></i></button>
            </div>
          </div>
          <div style="padding:0 32px;">
            <table style="width:100%; border-collapse:collapse;">
              <tbody id="industriesTableBody"></tbody>
            </table>
          </div>
          <div style="display:flex; justify-content:flex-end; align-items:center; gap:24px; padding:32px 32px;">
            <button class="action-btn update-btn" id="updateIndustryBtn">Update Industry</button>
            <button class="action-btn add-btn" id="addIndustryBtn" data-bs-toggle="modal" data-bs-target="#addIndustryModal">
              <span class="add-icon-circle"><i class="fa fa-plus"></i></span>
              Add new Industry
            </button>
          </div>
        </div>

        <!-- Add/Edit Industry Modal -->
        <div class="modal fade" id="addIndustryModal" tabindex="-1" aria-labelledby="addIndustryModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="addIndustryModalLabel">New Industries</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form id="industryForm">
                  <input type="hidden" id="editIndustryId" />
                  <div class="row mb-3">
                    <div class="col-md-4">
                      <label class="form-label">Total Industries</label>
                      <input type="text" class="form-control" id="totalIndustriesReadOnly" value="0" readonly>
                    </div>
                    <div class="col-md-8">
                      <label class="form-label">Industry Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="industryName" placeholder="Type your Industry name here...." required>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Upload Image <span class="text-danger">*</span></label>
                    <div class="input-group">
                      <input type="file" class="form-control" id="industryImage" accept="image/*">
                      <button class="btn btn-outline-secondary" type="button" id="industryUploadBtn"><i class="fa fa-upload"></i></button>
                    </div>
                    <img id="industryPreviewImg" src="#" alt="Preview" style="max-width:120px; margin-top:10px; display:none;" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Service Description <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="industryDesc" rows="3" placeholder="Write About Industry...." required></textarea>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-success" id="updateIndustryModalBtn">Update Industry</button>
                <button type="button" class="btn btn-primary" id="addNewIndustryModalBtn">Add new Industry</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        // Decide API base: when running from localhost:3000, call Apache at http://localhost/ROIwebsite/admin/
        const API_BASE = (location.hostname === 'localhost' && location.port === '3000')
          ? 'http://localhost/ROIwebsite/admin/'
          : './';

        async function asJson(res){
          const body = await res.text().catch(()=> '');
          if(!res.ok){
            throw new Error('HTTP '+res.status+' '+res.statusText+'\n'+body.slice(0,400));
          }
          try { return JSON.parse(body); }
          catch(e){ throw new Error('Invalid JSON from server.\n'+body.slice(0,400)); }
        }
        // Logout modal logic
        var logoutBtn = document.getElementById('logoutBtn');
        var logoutModalEl = document.getElementById('logoutModal');
        var confirmLogout = document.getElementById('confirmLogout');
        var logoutModal = new bootstrap.Modal(logoutModalEl);
        logoutBtn.addEventListener('click', function(){ logoutModal.show(); });
        confirmLogout.addEventListener('click', function(){ window.location.href = '../'; });

        // State
        let industries = [];  // {id,name,description,imageUrl,createdAt}
        let deleteId = null;

        const tbody = document.getElementById('industriesTableBody');
        const countEl = document.getElementById('totalIndustriesCount');
        const totalReadOnly = document.getElementById('totalIndustriesReadOnly');

        function fmt(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleDateString(undefined,{ year:'numeric', month:'long', day:'numeric'}); }catch(e){ return ''; } }
        function updateCount(){ const n = industries.length; countEl.textContent = String(n); totalReadOnly.value = String(n); }
        function render(list){
          tbody.innerHTML = '';
          list.forEach((it, i) => {
            tbody.innerHTML += `<tr>
              <td style='padding:12px 0; width:40px;'><input type='checkbox' data-id='${it.id}'></td>
              <td style='font-weight:normal;'>${it.name || ''}</td>
              <td style='color:#888; text-align:right;'>${fmt(it.createdAt)}</td>
              <td style='text-align:right; width:60px;'><i class='fa fa-trash' style='color:#222; cursor:pointer;' data-del='${it.id}'></i></td>
            </tr>`;
          });
          // bind delete icons
          Array.from(document.querySelectorAll("[data-del]"))?.forEach(icon => {
            icon.addEventListener('click', function(){ deleteId = this.getAttribute('data-del'); new bootstrap.Modal(document.getElementById('deleteModal')).show(); });
          });
        }

        async function load(){
          try{
            const res = await fetch(API_BASE + 'get_industries');
            const data = await asJson(res);
            industries = Array.isArray(data) ? data.map(d => ({ id:String(d.id), name:d.name, description:d.description, imageUrl:d.image, createdAt:d.createdAt })) : [];
            updateCount();
            filter();
          }catch(err){ console.error(err); }
        }

        function filter(){
          const q = (document.getElementById('industrySearch').value || '').toLowerCase();
          if(!q){ render(industries); return; }
          render(industries.filter(i => (i.name||'').toLowerCase().includes(q)));
        }

        document.getElementById('industrySearch').addEventListener('input', filter);
        document.getElementById('searchBtn').addEventListener('click', filter);

        // Delete flow
        document.getElementById('confirmDelete').addEventListener('click', async function(){
          if(!deleteId) return;
          try{
            const fd = new FormData(); fd.append('id', deleteId);
            const res = await fetch(API_BASE + 'api_delete', { method:'POST', body: fd });
            const j = await asJson(res);
            if(j && j.success){ await load(); } else { alert(j.message || 'Delete failed'); }
          }catch(err){ console.error(err); }
          finally{
            deleteId = null;
            const m = bootstrap.Modal.getInstance(document.getElementById('deleteModal')); if(m) m.hide();
          }
        });

        // Image helpers
        document.getElementById('industryUploadBtn').addEventListener('click', function(){ document.getElementById('industryImage').click(); });
        document.getElementById('industryImage').addEventListener('change', function(e){
          const f = e.target.files?.[0]; const prev = document.getElementById('industryPreviewImg');
          if(f){ const r=new FileReader(); r.onload = ev => { prev.src = ev.target.result; prev.style.display='block'; }; r.readAsDataURL(f); }
          else { prev.style.display='none'; }
        });

        // Open Add modal (clear fields)
        document.getElementById('addIndustryBtn').addEventListener('click', function(){
          document.getElementById('addIndustryModalLabel').textContent = 'New Industries';
          document.getElementById('industryForm').reset();
          document.getElementById('editIndustryId').value = '';
          document.getElementById('industryPreviewImg').style.display='none';
        });

        // Open Update modal (must select exactly one row)
        document.getElementById('updateIndustryBtn').addEventListener('click', function(){
          const checked = Array.from(document.querySelectorAll('#industriesTableBody input[type="checkbox"]:checked'));
          if(checked.length !== 1){ alert('Please select exactly one industry to update.'); return; }
          const id = checked[0].getAttribute('data-id');
          const it = industries.find(x => x.id === id);
          if(!it){ alert('Selected industry not found.'); return; }
          document.getElementById('addIndustryModalLabel').textContent = 'Edit Industry';
          document.getElementById('editIndustryId').value = it.id;
          document.getElementById('industryName').value = it.name || '';
          document.getElementById('industryDesc').value = it.description || '';
          const prev = document.getElementById('industryPreviewImg');
          if(it.imageUrl){ prev.src = it.imageUrl; prev.style.display='block'; } else { prev.style.display='none'; }
          const addModal = new bootstrap.Modal(document.getElementById('addIndustryModal'));
          addModal.show();
        });

        function validate(isAdd){
          let ok = true;
          const name = document.getElementById('industryName');
          const desc = document.getElementById('industryDesc');
          [name,desc].forEach(el => { if(!el.value || !el.value.trim()){ el.classList.add('is-invalid'); ok=false; } else { el.classList.remove('is-invalid'); } });
          const img = document.getElementById('industryImage');
          if(isAdd){ if(!img.files || img.files.length === 0){ img.classList.add('is-invalid'); ok=false; } else img.classList.remove('is-invalid'); }
          return ok;
        }

        // Add new
        document.getElementById('addNewIndustryModalBtn').addEventListener('click', async function(){
          if(!validate(true)) { const first = document.querySelector('.is-invalid'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'}); return; }
          try{
            const fd = new FormData();
            fd.append('name', document.getElementById('industryName').value.trim());
            fd.append('description', document.getElementById('industryDesc').value.trim());
            const f = document.getElementById('industryImage').files?.[0]; if(f) fd.append('image', f);
            const res = await fetch(API_BASE + 'api_upload', { method:'POST', body: fd });
            const j = await asJson(res);
            if(j && j.success){
              const m = bootstrap.Modal.getInstance(document.getElementById('addIndustryModal')); if(m) m.hide();
              await load();
            } else {
              alert(j.message || 'Failed to add industry');
            }
          }catch(err){ console.error(err); alert('Failed to add industry\n'+err.message); }
        });

        // Update existing
        document.getElementById('updateIndustryModalBtn').addEventListener('click', async function(){
          const id = document.getElementById('editIndustryId').value;
          if(!id){ alert('No industry selected to update.'); return; }
          if(!validate(false)) { const first = document.querySelector('.is-invalid'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'}); return; }
          try{
            const fd = new FormData();
            fd.append('id', id);
            fd.append('name', document.getElementById('industryName').value.trim());
            fd.append('description', document.getElementById('industryDesc').value.trim());
            const f = document.getElementById('industryImage').files?.[0]; if(f) fd.append('image', f);
            const res = await fetch(API_BASE + 'api_update', { method:'POST', body: fd });
            const j = await asJson(res);
            if(j && j.success){
              const m = bootstrap.Modal.getInstance(document.getElementById('addIndustryModal')); if(m) m.hide();
              await load();
            } else {
              alert(j.message || 'Failed to update industry');
            }
          }catch(err){ console.error(err); alert('Failed to update industry\n'+err.message); }
        });

        // initial
        load();
      });
    </script>
  </body>
</html>
